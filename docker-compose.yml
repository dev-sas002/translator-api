# One command, no manual steps:
#
#   docker compose up --build
#
# The API is then on http://localhost:8380 with seed data already loaded.
# Host ports are 8380/8381 to avoid colliding with anything on the defaults.
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-translator}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-translator}
      POSTGRES_DB: ${DATABASE_NAME:-translator_api_production}
    ports:
      - "8381:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-translator} -d ${DATABASE_NAME:-translator_api_production}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      # The app boots with an ephemeral key because it reads no encrypted
      # credentials; override for a real deployment.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dummy_development_secret_key_base_replace_in_production}
      DATABASE_NAME: ${DATABASE_NAME:-translator_api_production}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-translator}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-translator}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      RAILS_MAX_THREADS: "5"
    ports:
      - "8380:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  postgres-data:
