name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The test environment uses SQLite (config/database.yml), so no service
      # container is needed. CI also eager loads (config/environments/test.rb),
      # which catches constants that only resolve lazily.
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.3"
          bundler-cache: true

      - name: Lint
        run: bundle exec standardrb

      - name: Test
        run: bundle exec rspec
